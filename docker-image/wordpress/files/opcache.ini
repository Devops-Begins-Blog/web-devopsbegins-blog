; =============================================================================
; OPcache Configuration for WordPress
; =============================================================================
;
; OPcache stores precompiled PHP bytecode in shared memory.
; This eliminates the need to parse PHP files on each request.
;
; IMPORTANT: OPcache only caches PHP code, NOT database content.
; Comments, posts, and dynamic data are always fetched fresh from MySQL.
;
; =============================================================================

; Memory allocated for storing compiled scripts (in MB)
opcache.memory_consumption=128

; Memory for interned strings deduplication (in MB)
opcache.interned_strings_buffer=8

; Maximum number of scripts that can be cached
; WordPress has ~1500 core files, 4000 gives headroom for plugins/themes
opcache.max_accelerated_files=4000

; How often to check for PHP file changes (in seconds)
; 60 seconds is optimal for production since PHP files rarely change
; Container restart clears the cache during deploys
opcache.revalidate_freq=60

; Use faster shutdown sequence
opcache.fast_shutdown=1

; Enable OPcache for CLI (useful for WP-CLI commands)
opcache.enable_cli=1
