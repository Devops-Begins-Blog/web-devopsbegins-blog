; =============================================================================
; PHP Configuration for WordPress
; =============================================================================
;
; Tuned settings for WordPress workloads including media uploads,
; plugin operations, and page builder forms.
;
; =============================================================================

; Maximum size for uploaded files (media library)
upload_max_filesize=64M

; Maximum size of POST data (must be >= upload_max_filesize)
post_max_size=64M

; Memory limit per PHP process
; 256M provides headroom for WordPress + plugins
memory_limit=256M

; Maximum script execution time (in seconds)
; 5 minutes allows for plugin updates and large imports
max_execution_time=300

; Maximum number of input variables accepted
; Higher value needed for page builders (Elementor, etc.)
max_input_vars=3000
