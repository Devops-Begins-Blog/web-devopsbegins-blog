apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ include "wordpress.replicaCount" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
  {{- if eq .Values.mode "distributed" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "wordpress.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.persistence.enabled (eq .Values.mode "distributed") }}
      initContainers:
        {{- if .Values.persistence.enabled }}
        # Set permissions on wp-content PVC (runs as root)
        # Required because main container runs as non-root (www-data, UID 33)
        - name: init-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Setting wp-content permissions for UID 33 (www-data)..."
              chown -R 33:33 /var/www/html/wp-content
              chmod -R 755 /var/www/html/wp-content
              echo "Permissions set successfully"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
          securityContext:
            runAsUser: 0
        {{- end }}
        {{- if eq .Values.mode "distributed" }}
        # Create Redis session configuration file (runs as root)
        # Required because main container runs as non-root and cannot write to /usr/local/etc/php/conf.d/
        - name: init-redis-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Creating Redis session configuration..."
              cat > /php-config/redis-sessions.ini << 'EOF'
              ; =============================================================================
              ; Redis Session Handler - Generated by Helm initContainer
              ; =============================================================================
              ; Sessions stored in Redis DB {{ include "wordpress.redisSessionDatabase" . }} (DB 0 reserved for object cache)
              ; =============================================================================

              session.save_handler = redis
              session.save_path = "tcp://{{ include "wordpress.redisHost" . }}:{{ include "wordpress.redisPort" . }}?database={{ include "wordpress.redisSessionDatabase" . }}"
              session.gc_maxlifetime = 1440
              session.cookie_httponly = 1
              session.use_strict_mode = 1
              EOF
              chown 33:33 /php-config/redis-sessions.ini
              chmod 644 /php-config/redis-sessions.ini
              echo "Redis session configuration created successfully"
          volumeMounts:
            - name: php-config
              mountPath: /php-config
          securityContext:
            runAsUser: 0
        {{- end }}
      {{- end }}
      containers:
        - name: wordpress
          image: {{ include "wordpress.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "wordpress.fullname" . }}-config
          env:
            # Database password from Secret
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: {{ include "wordpress.databaseSecretKey" . }}
            {{- if and (eq .Values.mode "distributed") (eq (include "wordpress.redisHasAuth" .) "true") }}
            # Redis password (if auth enabled)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.redisSecretName" . }}
                  key: {{ include "wordpress.redisSecretKey" . }}
            {{- end }}
            {{- with .Values.wordpress.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.healthCheck.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.liveness.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.liveness.successThreshold }}
          {{- end }}
          {{- if .Values.healthCheck.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readiness.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.readiness.successThreshold }}
          {{- end }}
          {{- if .Values.healthCheck.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.startup.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.startup.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled (eq .Values.mode "distributed") }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: wp-content
              mountPath: /var/www/html/wp-content
            {{- end }}
            {{- if eq .Values.mode "distributed" }}
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/redis-sessions.ini
              subPath: redis-sessions.ini
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled (eq .Values.mode "distributed") }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: wp-content
          persistentVolumeClaim:
            claimName: {{ include "wordpress.pvcName" . }}
        {{- end }}
        {{- if eq .Values.mode "distributed" }}
        - name: php-config
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
