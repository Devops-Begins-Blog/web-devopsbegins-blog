# =============================================================================
# Nginx Load Balancer Configuration - DevOpsBegins Blog
# =============================================================================
#
# Distributes traffic across WordPress replicas using round-robin
# Adds response header to identify which backend served the request
#
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Upstream: WordPress Backends
    # -------------------------------------------------------------------------
    upstream wordpress {
        # Round-robin load balancing (default)
        server wordpress-1:80;
        server wordpress-2:80;

        # Keep connections alive to backends
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Server Block
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Proxy settings
        location / {
            proxy_pass http://wordpress;
            proxy_http_version 1.1;

            # Required headers for WordPress
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Keep-alive connections
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Add header to identify which backend served the request (debugging)
        add_header X-Upstream $upstream_addr always;
    }
}
